# ttsgrab — configuration file template.
#
# Copy to `config.yaml` and edit. Everything here is optional: the gateway boots with Edge
# TTS alone and reports every other provider as disabled, with a reason.
#
# Precedence: built-in defaults → this file → environment variables (env wins).
# Point elsewhere with `TTSGRAB_CONFIG=/path/to/config.yaml`.
#
# This file is also what the web UI at /settings writes, and it may hold provider API keys:
# this is a single-tenant gateway, so one known file with mode 0600 is simpler than spreading
# secrets across .env, the environment and the database. Writes are atomic and preserve every
# comment below — the comments are the documentation for each option.
#
# Environment variables still win. The settings page marks any key they shadow, so a saved
# value that has no effect is visible rather than assumed.
#
# Budget fields live under each provider (`google_cloud.monthly_budget_micro_usd`), because
# a single global cap cannot express "spend up to $3 on Google but nothing on Gemini".

env: prod

# --------------------------------------------------------------------------------------
# security
# --------------------------------------------------------------------------------------
security:
  # Set via TTSGRAB_ADMIN_TOKEN in `.env`, not here — this file is committed.
  admin_token: null
  # Additional long-lived keys. Prefer creating keys through POST /v1/keys, which hashes
  # them and lets you revoke one without restarting.
  api_keys: []
  # Unauthenticated requests from 127.0.0.1 are allowed. Convenient locally; turn off
  # before exposing the service to anything.
  allow_localhost_without_token: true
  # Per-key requests per minute, when the key has no override.
  rate_limit_per_minute: 60
  # Hard cap on one request. Longer input belongs in /v1/jobs.
  max_text_chars: 20000
  max_request_body_bytes: 8388608
  # Reference-clip uploads for voice cloning.
  allowed_upload_mimes: [audio/wav, audio/mpeg, audio/webm, audio/ogg, audio/flac]
  max_upload_bytes: 10485760
  # Worker base_url targets are SSRF-checked. Private LAN ranges are the point of
  # self-hosted workers, so they are allowed; cloud metadata endpoints never are.
  allow_private_worker_urls: true
  # Restrict workers to specific hosts. Empty = any host that passes the SSRF checks.
  allowed_worker_hosts: []

# --------------------------------------------------------------------------------------
# router — how a provider is chosen, and what happens when it fails
# --------------------------------------------------------------------------------------
# Favourite voices, seeded once into an empty database.
#
# Favourites are normally clicked in the UI and stored in the database, shared by everyone
# using this instance. This block exists so a fresh deployment starts with your team's
# shortlist instead of an empty one.
#
# Applied only when the favourites table is empty — removing one in the UI is permanent,
# because config is a starting point and not a policy.
favourites:
  seed_enabled: false
  seed:
    - zh-TW-HsiaoChenNeural
    - zh-TW-YunJheNeural

router:
  # Used when a request names no policy and no provider.
  #   cheapest | fastest | best_quality | local_only | free_only | explicit
  default_policy: cheapest
  # Tried in this order once the policy's ranking is exhausted. Providers that are
  # disabled, lack the voice, or have an open circuit breaker are skipped.
  fallback_chain: [edge, google_cloud, azure, google_ai_studio, kokoro, cosyvoice, gpt_sovits]
  # How many extra providers to try after the first. Raise it if you have many workers and
  # want a deeper safety net; each attempt costs latency when the situation is already bad.
  max_fallbacks: 3
  # Consecutive failures before a provider leaves rotation.
  circuit_breaker_threshold: 3
  # How long it stays out before one trial request is allowed through.
  circuit_breaker_cooldown_s: 60
  request_timeout_s: 60.0
  # Subjective quality ranking, used by best_quality. Higher is better. Adjust to taste —
  # these are opinions, not measurements.
  quality_scores:
    google_cloud: 0.95
    azure: 0.93
    google_ai_studio: 0.88
    cosyvoice: 0.85
    gpt_sovits: 0.80
    edge: 0.70
    kokoro: 0.65
    gtts: 0.40
    translate_tts: 0.40

# --------------------------------------------------------------------------------------
# cache
# --------------------------------------------------------------------------------------
cache:
  enabled: true
  dir: ./data/cache
  # Total on-disk budget. LRU by mtime once exceeded.
  max_bytes: 2147483648        # 2 GiB
  ttl_seconds: 2592000         # 30 days

# --------------------------------------------------------------------------------------
# retention — bounded growth for history, audio and idempotency records
# --------------------------------------------------------------------------------------
# Off by default: deleting someone's history is not something an upgrade should start doing
# on its own. Turn it on and nothing is unbounded any more.
retention:
  enabled: false
  # The newest N rows are always kept, whatever their age. Pruning below the internal floor
  # is refused, so a typo here cannot empty the history.
  keep_records: 5000
  max_age_days: 90
  idempotency_hours: 24
  # How often the maintenance pass runs.
  interval_s: 3600

# --------------------------------------------------------------------------------------
# long-form synthesis
# --------------------------------------------------------------------------------------
longform:
  enabled: true
  # Text above this is split into sentences and synthesised in parallel.
  chunk_threshold: 1200
  max_sentence_chars: 600
  max_concurrency: 4
  # Silence inserted between sentences when concatenating.
  pause_ms_between_sentences: 120

# --------------------------------------------------------------------------------------
# providers
# --------------------------------------------------------------------------------------
# Edge is the one unofficial provider enabled by default: no key, no signup, and the
# fastest way to hear something. It is not an official Microsoft API.
edge:
  enabled: true
  # Edge rejects requests that do not look like they come from a browser session.
  allow_public: true
  proxy: null

free_web:
  # Unofficial scraping endpoints. Off by default: they violate the terms of the services
  # they scrape and break without warning. Read the UI warning before enabling.
  enabled: false
  gtts_enabled: true
  gtts_tld: com
  translate_tts_enabled: true
  streamelements_enabled: false

google_cloud:
  # Official Cloud TTS API. Enabling this without credentials is safe: it stays disabled
  # and reports why. Prefer the file indirection so the secret never sits in this file:
  #   TTSGRAB_GOOGLE_CLOUD__CREDENTIALS_FILE=/run/secrets/google_credentials
  enabled: false
  credentials_file: null
  api_key: null
  project_id: null
  location: global
  # Free tier is tracked per tier (Standard/WaveNet/Neural2/Chirp3-HD), not per provider.
  respect_free_tier: true
  # 0 = no character cap. Overage is billed by Google, so set a budget.
  monthly_budget_chars: 0
  # Integer micro-USD. 3000000 = $3.00. The cap refuses rather than overspending.
  monthly_budget_micro_usd: 3000000

google_ai_studio:
  # Gemini 3.8 Flash TTS through the AI Studio API — separate from Cloud TTS, so it needs
  # its own keys (create them at https://aistudio.google.com/apikey).
  enabled: false
  model: gemini-3.8-flash-tts
  base_url: https://generativelanguage.googleapis.com/v1beta
  # Two buckets on purpose. A free key has a small *daily request* allowance (Gemini TTS
  # was cut to 10 RPD in November 2026) and will not carry a long document; a key on a
  # billed project has no daily request cap. The pool spends free allowance first.
  free_api_keys: []
  paid_api_keys: []
  free_rpd: 10
  # strategy: free_first | round_robin | least_used
  strategy: free_first
  monthly_budget_chars: 0
  monthly_budget_micro_usd: 1000000

azure:
  # Official Speech Service. F0 hard-stops at 500k chars/month instead of billing you.
  enabled: false
  region: eastasia
  # Set via TTSGRAB_AZURE__API_KEY in `.env`.
  api_key: null
  tier: F0
  # Azure has a character cap but no micro-USD budget field: on F0 the quota is the cap,
  # and on S0 you set regional spend limits in the Azure portal.
  monthly_budget_chars: 500000

# --------------------------------------------------------------------------------------
# workers — self-hosted model containers
# --------------------------------------------------------------------------------------
workers:
  health_interval_s: 20
  health_timeout_s: 5
  # Consecutive failures before a worker leaves rotation.
  unhealthy_threshold: 3
  # Consecutive successes before an unhealthy worker is trusted again.
  recovery_threshold: 2
  default_timeout_s: 120.0
  # Workers are registered at runtime over POST /v1/workers, which is how a GPU box joins
  # without editing this file. The database is the record of what exists.

# --------------------------------------------------------------------------------------
# mcp
# --------------------------------------------------------------------------------------
mcp:
  # Exposes /mcp with synthesize_speech, list_voices, list_providers, get_usage.
  enabled: true
  path: /mcp
  # Its tools synthesise speech, so the transport requires a bearer token. Unset falls back
  # to security.admin_token; with neither, the gateway refuses to mount it and logs why
  # rather than serving every tool to whoever can reach the port.
  # token: ""

# --------------------------------------------------------------------------------------
# process
# --------------------------------------------------------------------------------------
log_level: info
# json suits production; console is friendlier in a terminal.
log_format: json
